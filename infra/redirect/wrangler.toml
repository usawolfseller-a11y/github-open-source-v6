name = "ghs-links"
main = "worker.js"
compatibility_date = "2026-10-01"

# Fill both ids after `wrangler kv namespace create <NAME>`.
[[kv_namespaces]]
binding = "REPOS"
id = "REPLACE_WITH_REPOS_ID"

[[kv_namespaces]]
binding = "STATS"
id = "REPLACE_WITH_STATS_ID"

[vars]
# Set the real token with: wrangler secret put STATS_TOKEN
STATS_TOKEN = ""
