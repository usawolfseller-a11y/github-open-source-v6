[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GitHub-open-source-v6"
version = "0.1.0"
description = "Autonomous open-source discovery and publishing system for GitHub Open Source"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GitHub Open Source" }]
dependencies = [
  "requests>=2.32,<3",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ghos-v6 = "ghos_v6.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
