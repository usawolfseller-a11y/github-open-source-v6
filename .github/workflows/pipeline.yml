name: Publishing pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: Pipeline command
        type: choice
        default: collect
        options:
          - collect
          - publish
          - crossposts
          - article
          - news
          - digest
          - report
          - moderation
      slot:
        description: Publish slot label (publish command only)
        type: string
        default: manual
      force_news:
        description: Run AI Brief even if its feature flag is off (news command only)
        type: boolean
        default: false
  schedule:
    - cron: "20 4 * * *"
    - cron: "10 7 * * *"
    - cron: "40 12 * * *"
    - cron: "15 17 * * *"
    - cron: "35 22 * * *"
    - cron: "*/30 * * * *"
    - cron: "30 13 * * *"
    - cron: "40 15 * * 1,3,5"
    - cron: "10 16 * * 0"
    - cron: "40 16 * * 0"
    - cron: "15 */6 * * *"

permissions:
  contents: write

concurrency:
  group: state-writer
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      PUBLISH_TARGET: ${{ vars.PUBLISH_TARGET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_TEST_CHANNEL_ID: ${{ vars.TELEGRAM_TEST_CHANNEL_ID }}
      TELEGRAM_MAIN_CHANNEL_ID: ${{ vars.TELEGRAM_MAIN_CHANNEL_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ vars.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_SOURCE_CHANNELS: ${{ vars.TELEGRAM_SOURCE_CHANNELS }}
      GH_API_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
      DEV_API_KEY: ${{ secrets.DEV_API_KEY }}
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE_URL: ${{ vars.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ vars.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FEATURE_TELEGRAPH: ${{ vars.FEATURE_TELEGRAPH }}
      FEATURE_DEVTO: ${{ vars.FEATURE_DEVTO }}
      FEATURE_BLUESKY: ${{ vars.FEATURE_BLUESKY }}
      FEATURE_MASTODON: ${{ vars.FEATURE_MASTODON }}
      FEATURE_Facebook: ${{ vars.FEATURE_Facebook }}
      FEATURE_AI_BRIEF: ${{ vars.FEATURE_AI_BRIEF }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run pipeline command
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.command }}" in
              publish)
                ghos-v6 publish --slot "${{ inputs.slot }}"
                ;;
              news)
                if [ "${{ inputs.force_news }}" = "true" ]; then
                  ghos-v6 news --force
                else
                  ghos-v6 news
                fi
                ;;
              *)
                ghos-v6 "${{ inputs.command }}"
                ;;
            esac
          else
            ghos-v6 scheduled --schedule "${{ github.event.schedule }}"
          fi
      - name: Commit state
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json state/events.jsonl
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore(state): update publishing state [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
